[tool.ruff]
target-version = "py311"
line-length = 160
exclude = [
  "datasets/*",
  "scripts/*",
  "runners/export.py",  # acesta e YAML, nu Python
]

requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
  "E401","E701","E702","E501",  # <-- ignoră line-length
  "F401",
  "I001",
  "UP035","UP006","UP015",
  "B905","B007",               # <-- ignoră loop-var nefolosită
]

# pyproject.toml
[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ultra_low_power_se"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["torch", "numpy", "soundfile", "pyyaml", "onnx>=1.15", "onnxruntime>=1.18"]

[tool.setuptools.packages.find]
where = ["."]
include = ["se_*", "runners", "deploy"]
