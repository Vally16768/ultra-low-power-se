[tool.ruff]
target-version = "py311"
line-length = 160
exclude = [
  "datasets/*",
  "scripts/*",
  "runners/export.py",  # acesta e YAML, nu Python
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
  "E401","E701","E702","E501",  # <-- ignoră line-length
  "F401",
  "I001",
  "UP035","UP006","UP045","UP015",
  "B905","B007",               # <-- ignoră loop-var nefolosită
]
