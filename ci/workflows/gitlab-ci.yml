stages:
  - lint_unit
  - metrics_unit
  - build
  - train_smoke
  - export_onnx_parity
  - infer_offline
  - quant_rescore
  - gate

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHON_VERSION: "3.11"
  MPLBACKEND: Agg

cache:
  paths:
    - .cache/pip
    - .venv/

lint_unit:
  stage: lint_unit
  image: python:3.11-slim
  script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt pytest ruff mypy
    - ruff check .
    - mypy --install-types --non-interactive src || true
    - pytest -q
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: report.xml

metrics_unit:
  stage: metrics_unit
  image: python:3.11-slim
  needs: ["lint_unit"]
  script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt pesq==0.0.4 pystoi numpy soundfile
    - pytest -q tests/test_metrics_fixtures.py

build_images:
  stage: build
  image: docker:stable
  services: [docker:dind]
  variables:
    DOCKER_DRIVER: overlay2
  needs: ["metrics_unit"]
  script:
    - docker build -f docker/Dockerfile.cpu -t registry.example.com/ulp-se/cpu:$CI_COMMIT_SHA .
  only:
    - merges
    - main

train_smoke:
  stage: train_smoke
  image: python:3.11-slim
  needs: ["build_images"]
  script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
    - python train.py --config configs/vb_demand_mamba.yaml --epochs 1 --limit_train_batches 50 --limit_val_batches 5 --num_workers 2 --out-dir artifacts/smoke
  artifacts:
    paths:
      - artifacts/smoke
    expire_in: 1 week

export_onnx_parity:
  stage: export_onnx_parity
  image: python:3.11-slim
  needs: ["train_smoke"]
  script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
    - python deploy/export_onnx.py --config configs/vb_demand_mamba.yaml --ckpt artifacts/smoke/latest.ckpt --out artifacts/export/mamba_unet_v0.onnx
    - python deploy/sanity_onnx.py artifacts/export/mamba_unet_v0.onnx --print-json > artifacts/export/parity.json
    - python - << 'PY'
import json, sys
p=json.load(open("artifacts/export/parity.json"))
sys.exit(0 if p.get("max_L2",1e9)<=1e-5 else 2)
PY
  artifacts:
    paths:
      - artifacts/export
    expire_in: 1 week

infer_offline:
  stage: infer_offline
  image: python:3.11-slim
  needs: ["export_onnx_parity"]
  script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt pesq==0.0.4 pystoi soundfile numpy scipy
    - test -f data/lists/voicebank_mini.txt
    - python eval/bench_onnx.py --onnx artifacts/export/mamba_unet_v0.onnx --list data/lists/voicebank_mini.txt --sr 16000 --out-dir results/ci/voicebank_mini
  artifacts:
    paths:
      - results/ci/voicebank_mini/metrics.json
    expire_in: 1 week

quant_prune_rescore:
  stage: quant_rescore
  image: python:3.11-slim
  needs: ["infer_offline"]
  script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt onnx onnxruntime onnxruntime-tools numpy pesq==0.0.4 pystoi soundfile
    - python deploy/quantize_onnx.py --in artifacts/export/mamba_unet_v0.onnx --out artifacts/export/mamba_unet_v0_int8.onnx --method int8_dynamic
    - python eval/bench_onnx.py --onnx artifacts/export/mamba_unet_v0_int8.onnx --list data/lists/voicebank_mini.txt --sr 16000 --out-dir results/ci/voicebank_mini_int8
  artifacts:
    paths:
      - artifacts/export/mamba_unet_v0_int8.onnx
      - results/ci/voicebank_mini_int8/metrics.json
    expire_in: 1 week

gate:
  stage: gate
  image: python:3.11-slim
  needs: ["infer_offline","quant_prune_rescore"]
  script:
    - python - << 'PY'
import json, sys
baseline = json.load(open("baselines/voicebank_mini_golden.json"))
metrics  = json.load(open("results/ci/voicebank_mini/metrics.json"))
keys = ["PESQ_WB","STOI","SI_SDR","SegSNR"]
thresh = {"PESQ_WB": -0.03, "STOI": -0.002, "SI_SDR": -0.15, "SegSNR": -0.1}
bad=[]
for k in keys:
  b=baseline.get(k); a=metrics.get(k)
  if b is None or a is None: bad.append(k); continue
  if a-b < thresh[k]: bad.append(k)
if bad:
  print("GATE FAIL:", bad); sys.exit(1)
print("GATE PASS")
PY
