name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        py: [ "3.10", "3.11" ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}

      - name: Create venv & install project
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install -U pip wheel
          pip install -e .

      - name: Install dev deps (ruff/mypy/pytest/onnx/onnxruntime)
        run: |
          . .venv/bin/activate
          pip install -U ruff mypy pytest onnx onnxruntime

      - name: Lint
        run: |
          . .venv/bin/activate
          ruff check .

      - name: Type check
        run: |
          . .venv/bin/activate
          mypy .

      - name: Tests (if any)
        run: |
          . .venv/bin/activate
          if [ -d tests ]; then pytest -q; else echo "No tests/ directory — skipping"; fi

      - name: Export ONNX
        run: |
          . .venv/bin/activate
          python deploy/export_onnx_min.py \
            --config configs/exp_mamba_unet.yaml \
            --out artifacts/export/mamba_unet_ci.onnx \
            --opset 17 --sample_len 16000

      - name: ONNX Sanity
        run: |
          . .venv/bin/activate
          python - <<'PY'
          import onnx, onnxruntime as ort, numpy as np
          m="artifacts/export/mamba_unet_ci.onnx"
          onnx.checker.check_model(onnx.load(m))
          s=ort.InferenceSession(m, providers=["CPUExecutionProvider"])
          x=np.zeros((1,1,16000),np.float32)
          y=s.run(["enhanced"],{"noisy":x})[0]
          assert y.shape==(1,1,16000)
          print("ONNX sanity OK:", y.shape)
          PY

      - name: Parity (PT vs ONNX)
        run: |
          . .venv/bin/activate
          python tools/parity_onnx.py \
            --model se_models.mamba_unet.model \
            --config configs/exp_mamba_unet.yaml \
            --onnx artifacts/export/mamba_unet_ci.onnx \
            --T 16000 --tol 0.02

      - name: Quantize (dynamic INT8)
        run: |
          . .venv/bin/activate
          python deploy/quantize_onnx.py \
            --in_model artifacts/export/mamba_unet_ci.onnx \
            --out_model artifacts/export/mamba_unet_ci.int8.onnx \
            --weight_type QInt8
