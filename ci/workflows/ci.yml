name: ultra-low-power-se CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  PIP_CACHE_DIR: ~/.cache/pip
  HF_HOME: ~/.cache/huggingface
  MPLBACKEND: Agg

jobs:
  lint_unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install deps (base + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -r runners/requirements-hil.txt || true
          pip install -r requirements.txt
          pip install pytest ruff mypy

      - name: Ruff (lint)
        run: ruff check .

      - name: Mypy (types)
        run: mypy --install-types --non-interactive src || true

      - name: Pytest (unit)
        run: pytest -q

  metrics_unit:
    runs-on: ubuntu-latest
    needs: [lint_unit]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install deps (metrics)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pesq==0.0.4 pystoi numpy soundfile

      - name: Validate PESQ/STOI on fixtures
        run: |
          pytest -q tests/test_metrics_fixtures.py

  build_images:
    runs-on: ubuntu-latest
    needs: [metrics_unit]
    steps:
      - uses: actions/checkout@v4

      - name: Build CPU image
        run: docker build -f docker/Dockerfile.cpu -t ulp-se:cpu .

      # (opțional – doar dacă ai runner GPU self-hosted)
      # - name: Build GPU image
      #   run: docker build -f docker/Dockerfile.gpu -t ulp-se:gpu .

  train_smoke:
    runs-on: ubuntu-latest
    needs: [build_images]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train smoke (1 epoch on tiny subset)
        run: |
          python train.py \
            --config configs/vb_demand_mamba.yaml \
            --epochs 1 \
            --limit_train_batches 50 \
            --limit_val_batches 5 \
            --num_workers 2 \
            --out-dir artifacts/smoke

      - name: Upload smoke artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smoke_ckpt
          path: artifacts/smoke

  export_onnx_parity:
    runs-on: ubuntu-latest
    needs: [train_smoke]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Export ONNX from latest smoke checkpoint
        run: |
          python deploy/export_onnx.py --config configs/vb_demand_mamba.yaml \
            --ckpt artifacts/smoke/latest.ckpt \
            --out artifacts/export/mamba_unet_v0.onnx

      - name: Parity PyTorch↔ONNX
        run: |
          python deploy/sanity_onnx.py artifacts/export/mamba_unet_v0.onnx --print-json > artifacts/export/parity.json
          # Fail if max L2 > 1e-5 (ajustează dacă e cazul)
          python - << 'PY'
import json, sys
p = json.load(open("artifacts/export/parity.json"))
tol = 1e-5
ok = p.get("max_L2", tol) <= tol
print("Parity:", p)
sys.exit(0 if ok else 2)
PY

      - uses: actions/upload-artifact@v4
        with:
          name: export_onnx
          path: artifacts/export

  infer_offline:
    runs-on: ubuntu-latest
    needs: [export_onnx_parity]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install deps (eval)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pesq==0.0.4 pystoi soundfile numpy scipy

      - name: Prepare VoiceBank-mini list
        run: |
          # Asumăm că ai lista pregătită în repo (poți genera în prealabil)
          test -f data/lists/voicebank_mini.txt

      - name: Infer ONNX offline + score
        run: |
          python eval/bench_onnx.py \
            --onnx artifacts/export/mamba_unet_v0.onnx \
            --list data/lists/voicebank_mini.txt \
            --sr 16000 \
            --out-dir results/ci/voicebank_mini
          # bench_onnx.py trebuie să producă results/ci/voicebank_mini/metrics.json

      - name: Upload metrics
        uses: actions/upload-artifact@v4
        with:
          name: metrics_offline
          path: results/ci/voicebank_mini/metrics.json

  quant_prune_rescore:
    runs-on: ubuntu-latest
    needs: [infer_offline]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install onnx onnxruntime onnxruntime-tools numpy pesq==0.0.4 pystoi soundfile

      - name: Quantize/prune + re-score
        run: |
          # INT8 (PTQ) exemplu; adaptează la tool-ul tău
          python deploy/quantize_onnx.py \
            --in artifacts/export/mamba_unet_v0.onnx \
            --out artifacts/export/mamba_unet_v0_int8.onnx \
            --method int8_dynamic

          # (opțional) prune structurally înainte/după quant
          # python deploy/prune_onnx.py --in ... --out ...

          python eval/bench_onnx.py \
            --onnx artifacts/export/mamba_unet_v0_int8.onnx \
            --list data/lists/voicebank_mini.txt \
            --sr 16000 \
            --out-dir results/ci/voicebank_mini_int8

      - name: Upload quantized results
        uses: actions/upload-artifact@v4
        with:
          name: metrics_offline_int8
          path: |
            artifacts/export/mamba_unet_v0_int8.onnx
            results/ci/voicebank_mini_int8/metrics.json

  gate:
    runs-on: ubuntu-latest
    needs: [infer_offline, quant_prune_rescore]
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts_dl

      - name: Gate vs golden baseline
        run: |
          python - << 'PY'
import json, sys, os, glob
# Baseline (în repo)
baseline = json.load(open("baselines/voicebank_mini_golden.json"))
# Actual
candidates = glob.glob("artifacts_dl/**/metrics.json", recursive=True)
if not candidates:
    print("No metrics.json found"); sys.exit(2)
# Ia cel mai important: FP32
metrics = json.load(open([p for p in candidates if "voicebank_mini/metrics.json" in p][0]))
# Chei relevante
keys = ["PESQ_WB","STOI","SI_SDR","SegSNR"]
# Praguri minime (delta acceptabil negativ)
thresh = {"PESQ_WB": -0.03, "STOI": -0.002, "SI_SDR": -0.15, "SegSNR": -0.1}
fail = []
for k in keys:
    b = baseline.get(k)
    a = metrics.get(k)
    if b is None or a is None: 
        print(f"Missing key {k}"); fail.append(k); continue
    delta = a - b
    print(f"{k}: actual={a:.4f} baseline={b:.4f} delta={delta:+.4f}")
    if delta < thresh[k]:
        fail.append(k)
if fail:
    print("GATE FAIL on:", fail)
    sys.exit(1)
print("GATE PASS")
PY

