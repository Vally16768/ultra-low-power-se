name: ultra-low-power-se CI

on:
  pull_request:
  push:

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint_unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          # Dacă nu ai încă requirements.txt, creează-l gol sau minimal
          test -f requirements.txt || echo "" > requirements.txt
          pip install -r requirements.txt
          pip install pytest ruff mypy
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy --install-types --non-interactive src || true
      - name: Pytest
        run: pytest -q || true
