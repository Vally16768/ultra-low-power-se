name: ultra-low-power-se CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "CI merge 🎉"

  lint_unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Show versions
        run: |
          python -V
          pip -V

      - name: Install deps (lint/unit)
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade pytest ruff mypy numpy types-PyYAML

      - name: Ruff
        run: ruff check .

      - name: Mypy (typed subset)
        run: mypy --config-file mypy.ini --install-types --non-interactive

      - name: Pytest
        run: pytest -q
