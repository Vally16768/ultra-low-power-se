name: ultra-low-power-se CI

on:
  pull_request:
  push:
    branches: [ main ]
  schedule:
    - cron: "0 2 * * *"        # nightly @ 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "CI merge 🎉"

  lint_unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Show versions
        run: |
          python -V
          pip -V

      - name: Install deps (lint/unit)
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade pytest ruff mypy numpy types-PyYAML

      - name: Ruff
        run: ruff check .

      - name: Mypy (typed subset)
        run: mypy --ignore-missing-imports se_cli runners deploy datasets se_models

      - name: Pytest
        run: pytest -q

  metrics_unit:
    runs-on: ubuntu-latest
    needs: lint_unit
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: System deps (libsndfile for soundfile)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libsndfile1

      - name: Install Python deps (metrics)
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy soundfile pesq pystoi onnxruntime

      - name: Pytest (metrics fixtures)
        run: python -m pytest -q tests/test_metrics_fixtures.py

      - name: Upload pytest reports (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrics-unit-logs
          path: |
            .pytest_cache
            **/.pytest_cache

  train_smoke:
    runs-on: ubuntu-latest
    needs: [lint_unit]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Deps
        run: |
          sudo apt-get update -y && sudo apt-get install -y libsndfile1
          python -m pip install --upgrade pip
          pip install "torch==2.3.*" --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pyyaml tensorboard soundfile onnx onnxruntime

      - name: Smoke train (1 epoch, tiny split)
        run: |
          python -m se_cli.cli train --config configs/exp_mamba_unet.yaml -o train.epochs=1

      - name: Upload checkpoints (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-checkpoints
          path: |
            artifacts/exp/**/ckpt/**
            artifacts/exp/**/logs/**

  export_onnx_parity:
    runs-on: ubuntu-latest
    needs: [train_smoke]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Deps
        run: |
          python -m pip install --upgrade pip
          pip install onnx onnxruntime "torch==2.3.*" --index-url https://download.pytorch.org/whl/cpu
          pip install numpy

      - name: Export ONNX (opset 17)
        run: |
          python -m se_cli.cli export --config configs/exp_mamba_unet.yaml -o export.onnx.opset=17

      - name: Sanity ONNX (auto-detect I/O names)
        run: |
          python deploy/sanity_onnx.py artifacts/export/mamba_unet_v0.onnx

      - name: Upload ONNX
        uses: actions/upload-artifact@v4
        with:
          name: onnx-export
          path: artifacts/export/*.onnx

  sanity_onnx_repo:
    runs-on: ubuntu-latest
    needs: [lint_unit]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps (ONNX sanity)
        run: |
          python -m pip install --upgrade pip
          pip install onnx onnxruntime numpy

      - name: Find any ONNX in repo (optional)
        id: findonnx
        run: |
          set -e
          FILE=$(git ls-files '*.onnx' | head -n1 || true)
          if [ -z "$FILE" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No ONNX found; skipping sanity check."
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "path=$FILE" >> "$GITHUB_OUTPUT"
            echo "Found ONNX: $FILE"
          fi

      - name: Sanity check ONNX (repo-stored)
        if: steps.findonnx.outputs.found == 'true'
        run: |
          python deploy/sanity_onnx.py "${{ steps.findonnx.outputs.path }}"
