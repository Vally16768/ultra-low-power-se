name: ultra-low-power-se CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "CI merge 🎉"

  lint_unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps (lint/unit)
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff mypy numpy

      - name: Ruff
        run: ruff check .

      - name: Mypy
        # dacă mypy.ini cere "files = src" și nu ai folderul, nu bloca pipeline-ul
        run: mypy --install-types --non-interactive . || true

      - name: Pytest
        run: pytest -q
