[mypy]
python_version = 3.11
# Verificăm doar subsetul stabil; poți extinde lista treptat
files = se_cli/utils/seed.py
# Nu blocăm pe third-party fără stubs (torch, onnx, pesq etc.)
ignore_missing_imports = True
follow_imports = skip
warn_unused_configs = True
# Ținem lucrurile relaxate ca să nu pice pipeline-ul pe lipsă de adnotări
disallow_untyped_defs = False
no_implicit_optional = False
warn_return_any = False
warn_unused_ignores = False

# (exemple corecte de pattern, dacă vrei să granularizezi pe viitor)
[mypy-onnx.*]
ignore_missing_imports = True

[mypy-onnxruntime.*]
ignore_missing_imports = True

[mypy-pystoi.*]
ignore_missing_imports = True
