experiment:
  name: dccrn_edge_xs
  outdir: artifacts/exp/dccrn_edge_xs

data:
  sample_rate: 16000
  train:
    clean_manifest: data/prepared/voicebank/train/clean.csv
    noise_root: data/noise/demand
    snr_min: 0
    snr_max: 20
    curriculum:
      warmup_epochs: 8
      snr_min_after: 0
      snr_max_after: 20
  val:
    pairs_manifest: data/prepared/voicebank/val/manifests/pairs.csv
  test:
    pairs_manifest: data/prepared/voicebank/test/manifests/pairs.csv

model:
  module: se_models.dccrn.model:build_model
  args:
    fft: 320
    hop: 160
    win: 320
    num_feats: 257
    complex: true
    use_causal: true
    enc_channels: [48,96,192,192]
    dec_channels: [192,192,96,48]
    rnn: "gru"
    rnn_hidden: 192
    rnn_layers: 1
    rnn_bidirectional: false
    mask_activation: "tanh"

train:
  batch_size: 12
  epochs: 80
  optimizer: adam
  lr: 2.0e-3
  scheduler: reduce_on_plateau
  grad_clip: 5.0
  seed: 42
  mixed_precision: true

loss:
  time_l1: 0.5
  sisdr: 1.0
  mrstft:
    weight: 0.5
    fft_sizes: [256,512,1024]
    hops: [64,128,256]
    wins: [256,512,1024]

eval:
  metrics: ["pesq","stoi","si_sdr","seg_snr"]
  streaming:
    enabled: true
    frame_ms: 20
    lookahead_ms: 0
export:
  onnx:
    dynamic_axes: true
