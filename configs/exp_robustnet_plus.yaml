experiment: robustnet_plus_v2

model:
  target: se_models.robustnet_plus.model.RobustTCNPlusSE
  params:
    in_channels: 1
    out_channels: 1
    width: 64           # exemplu (ULP: păstrează-l mic)
    depth: 8
    kernel_size: 15
    causal: true
    norm: "gLN"
    act: "PReLU"

data:
  sr: 16000
  train_csv: data/prepared/train_mixes/manifests/pairs.csv
  val_csv:   data/prepared/dev_mixes/manifests/pairs.csv
  test_csv:  data/prepared/voicebank/test/manifests/pairs.csv
  segment_len_sec: 1.0      # 16k e ok pentru ULP
  overlap: 0.25

train:
  batch_size: 8
  epochs: 50
  optimizer: { type: adam, lr: 3.0e-3, weight_decay: 0.0 }
  scheduler: { type: ReduceLROnPlateau, factor: 0.5, patience: 3, min_lr: 1.0e-5 }
  grad_clip: 5.0
  seed: 1337

loss:
  - type: l1_time
  - type: si_sdr

eval:
  outdir: artifacts/eval/max/enhanced

inference:
  checkpoint: null
  in_wav: null
  out_wav: enhanced.wav
  outdir: artifacts/eval/max/enhanced

export:
  checkpoint: null
  out: artifacts/export/robustnet_plus.onnx
  opset: 17
  sample_len: 16000
