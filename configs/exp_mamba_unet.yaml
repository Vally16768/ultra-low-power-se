# -----------------------------
# Ultra-Low-Power SE — Config exemplu mamba_unet
# -----------------------------

project:
  name: ultra-low-power-se
  seed: 1234

data:
  sample_rate: 16000
  # Seturi folosite la train/val — păstrate aici ca referință.
  voicebank:
    root: data/voicebank-demand-16k
    train_manifest: data/prepared/voicebank/train/manifests/pairs.csv
    val_manifest:   data/prepared/voicebank/val/manifests/pairs.csv
    test_manifest:  data/prepared/voicebank/test/manifests/pairs.csv

model:
  # Factory care construiește modelul (returnează nn.Module)
  # Acceptă "modul:funcție" sau "modul" (caută build_model).
  module: se_models.mamba_unet.model:build_model

  # Exemplu de hiperparametri (trebuie să se potrivească EXACT cu ce ai folosit la antrenare)
  params:
    in_channels: 1
    out_channels: 1
    base_channels: 48          # asigură-te că dă ~1.81M param. ca în log
    depth: 4
    kernel_size: 15
    stride: 2
    # Adaugă aici orice alt parametru specific modelului tău

train:
  optimizer:
    name: adamw
    lr: 0.001
    weight_decay: 0.0
  scheduler:
    name: ReduceLROnPlateau
    mode: min
    factor: 0.5
    patience: 5
    min_lr: 1.0e-6
    # 'verbose' nu e suportat de wrapperul tău, așa că nu-l punem.
  batch_size: 8
  num_workers: 4
  pin_memory: true
  epochs: 100
  outdir: artifacts/exp/mamba_unet_v0
  tb_dir: artifacts/exp/mamba_unet_v0/tb

loss:
  # exemplu — ajustează după implementarea ta
  l1_time: 1.0
  mrstft_mag_l1: 0.5
  mrstft_sc: 0.5
  si_sdr: 0.2

export:
  onnx:
    out: artifacts/export/mamba_unet_auto.onnx
    opset: 17

eval:
  # Manifestul offline (cum apare în logurile tale)
  manifest: data/prepared/voicebank/test/manifests/pairs.csv
  outdir: artifacts/eval/mamba_unet/enhanced
  metrics: [pesq, stoi, si_sdr, seg_snr]
  streaming:
    enabled: false

inference:
  # IMPORTANT: setat explicit, ca să nu mai “autodiscover” un ckpt nepotrivit
  checkpoint: artifacts/exp/mamba_unet_v0/best.ckpt
