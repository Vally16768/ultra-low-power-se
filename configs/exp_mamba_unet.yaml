# configs/exp_mamba_unet.yaml
experiment:
  name: mamba_unet_v0
  out_dir: artifacts/exp

model:
  base_channels: 32
  depth: 3
  causal: true     # pentru streaming/edge

data:
  sample_rate: 16000
  train_manifest: data/prepared/mix/train/manifests/pairs.csv
  val_manifest:   data/prepared/mix/val/manifests/pairs.csv
  manifests:
    test_offline:  data/prepared/voicebank/test/manifests/pairs.csv
    test_streaming: data/prepared/test_challenge/streaming/manifests/pairs.csv

model:
  module: se_models.mamba_unet.model:build_model
  name: mamba_unet
  in_ch: 1
  base: 32
  checkpoint: artifacts/exp/mamba_unet_v0/checkpoints/best.ckpt  

train:
  epochs: 50
  batch_size: 8
  lr: 2.0e-4
  segment_sec: 4.0
  seed: 1337
  num_workers: 4

  amp: true
  grad_clip: 5.0

  w_time: 0.2
  w_mag:  0.6
  w_sc:   0.2
  w_sisdr: 1.0

  scheduler:
    mode: min
    factor: 0.5
    patience: 5
    min_lr: 1.0e-6
    cooldown: 0

  early_stopping:
    patience: 10
    min_delta: 0.0

eval:
  sr: 16000
  metrics: [pesq, stoi, si_sdr, seg_snr]
  offline:
    manifest: ${data.manifests.test_offline}
    outdir: artifacts/eval/mamba_unet/enhanced
  streaming:
    enabled: false
    manifest: ${data.manifests.test_streaming}

inference:
  out_wav: artifacts/demo_out.wav
  seconds: 1
